name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: ios-v1.6.0
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source bundle
        run: curl -fL https://sankchat.fun/downloads/sankchat-ios-source-r2.zip -o /tmp/sankchat-ios-source.zip

      - name: Extract source bundle
        run: unzip -q /tmp/sankchat-ios-source.zip -d source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Install dependencies
        working-directory: source/client
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: source/client
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://sankchat.fun

      - name: Package unsigned IPA
        run: |
          chmod +x source/scripts/package_unsigned_ipa.sh
          source/scripts/package_unsigned_ipa.sh \
            source/client/build/ios/iphoneos/Runner.app \
            dist/SankChat-iOS-v1.6.0-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SankChat-iOS-v1.6.0-unsigned
          path: dist/SankChat-iOS-v1.6.0-unsigned.ipa
          if-no-files-found: error

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ github.event.inputs.release_tag }}" || true
          git push origin "${{ github.event.inputs.release_tag }}" || true

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          name: SankChat iOS ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/SankChat-iOS-v1.6.0-unsigned.ipa
          body: |
            SankChat iOS v1.6.0 unsigned IPA.

            该 IPA 未签名，不能直接在 iPhone 上安装。
            测试人员需使用 Sideloadly 或 AltStore，使用自己的 Apple ID 重签后安装。
